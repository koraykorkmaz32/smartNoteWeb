<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Defter | Analiz Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- TOAST BİLDİRİM -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- GİRİŞ EKRANI -->
    <div id="login-section" class="max-w-md mx-auto mt-20 p-8 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Platforma Giriş</h1>
            <p class="text-sm text-slate-500 mt-1">Dijital evrak arşivinize erişin</p>
        </div>
        <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-2 bg-white border border-slate-300 text-slate-700 font-medium py-2.5 rounded-lg hover:bg-slate-50 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google ile Devam Et
        </button>
        <div class="relative flex items-center py-2"><div class="flex-grow border-t border-slate-200"></div><span class="mx-4 text-slate-400 text-xs">veya</span><div class="flex-grow border-t border-slate-200"></div></div>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="E-posta" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-1 focus:ring-slate-400">
            <input type="password" id="password" placeholder="Şifre" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-1 focus:ring-slate-400">
            <button onclick="login()" class="w-full bg-slate-900 text-white font-medium py-3 rounded-lg hover:bg-slate-800">Giriş Yap</button>
        </div>
    </div>

    <!-- DASHBOARD EKRANI -->
    <div id="app-section" class="max-w-5xl mx-auto w-full mt-6 flex-grow hidden flex-col">
        
        <!-- Navbar -->
        <header class="bg-white border border-slate-200 rounded-xl px-6 py-4 flex justify-between items-center mb-6 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-slate-900 text-white rounded-lg flex items-center justify-center font-bold text-lg">A</div>
                <h1 class="font-semibold tracking-tight text-slate-900">Akıllı Defter</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-email-display" class="text-sm font-medium text-slate-500"></span>
                <button onclick="logout()" class="text-sm text-red-500 font-medium hover:text-red-700">Çıkış</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-10">
            
            <!-- SOL PANEL: Kontrol & Yükleme -->
            <div class="lg:col-span-1 space-y-4">
                
                <!-- İstatisikler -->
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Arşiv Özeti</h3>
                    <div class="mb-3">
                        <p class="text-xs text-slate-500">Toplam Evrak</p>
                        <p id="total-docs" class="text-2xl font-bold text-slate-900">0</p>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500">Son Güncelleme</p>
                        <p id="last-update" class="text-sm font-medium text-slate-700">-</p>
                    </div>
                </div>

                <!-- Yükleme Modülü -->
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Yeni Kayıt</h3>
                    <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-slate-200 border-dashed rounded-lg cursor-pointer hover:bg-slate-50 transition-colors">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <span class="text-2xl mb-1">📄</span>
                            <p class="text-xs font-medium text-slate-500">Dosya seç veya sürükle</p>
                        </div>
                        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="updateFileName()"/>
                    </label>
                    <p id="fileNameDisplay" class="text-xs text-blue-600 mt-2 font-medium hidden text-center truncate"></p>
                    <button onclick="uploadImage()" id="uploadBtn" class="mt-3 w-full bg-slate-900 text-white text-sm font-medium py-2.5 rounded-lg hover:bg-slate-800">Sisteme İşle</button>
                </div>
                
                <!-- Arama ve PDF -->
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm space-y-3">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="ID veya kelime ara..." onkeyup="if(event.key === 'Enter') searchTags()" class="w-full pl-3 pr-10 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-slate-400">
                        <button onclick="searchTags()" class="absolute right-2 top-1.5 p-1 text-slate-400 hover:text-slate-700">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </button>
                    </div>
                    <button onclick="downloadPDF()" class="w-full flex justify-center items-center gap-2 border border-slate-200 bg-white text-slate-700 text-sm font-medium py-2 rounded-lg hover:bg-slate-50">
                        📄 Raporu İndir (PDF)
                    </button>
                </div>

            </div>

            <!-- SAĞ PANEL: Veri Akışı ve Etiketler -->
            <div class="lg:col-span-3 flex flex-col gap-4">
                
                <!-- AI Etiketleri Alanı (Otomatik dolacak) -->
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                    <div class="flex items-center gap-2 mb-3">
                        <svg class="w-4 h-4 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z"/></svg>
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Popüler Konular</span>
                    </div>
                    <div id="ai-tags-container" class="flex flex-wrap gap-2">
                        <!-- Etiketler buraya gelecek -->
                        <span class="text-xs text-slate-400 italic">Evrak yüklendikçe etiketler burada belirecek...</span>
                    </div>
                </div>

                <!-- Evrak Kartları -->
                <div id="resultsArea" class="flex-grow overflow-y-auto pr-2 pb-10 space-y-4">
                    <div class="flex flex-col items-center justify-center h-64 text-slate-400">
                        <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-slate-400 mb-3"></div>
                        <p class="text-sm">Arşiv senkronize ediliyor...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- TEMEL FONKSİYONLAR ---
        const SERVER_URL = "https://smartnoteapi-hgkd.onrender.com"; 
        let currentUserUid = null; 
        let globalNotes = []; // Dashboard için verileri bellekte tutuyoruz

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-slate-900' : (type === 'error' ? 'bg-red-500' : 'bg-blue-500');
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium transform transition-all duration-300 translate-x-full opacity-0`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function updateFileName() {
            const input = document.getElementById('fileInput');
            const display = document.getElementById('fileNameDisplay');
            if (input.files.length > 0) { display.innerText = input.files[0].name; display.classList.remove('hidden'); } 
            else display.classList.add('hidden');
        }

        // --- FIREBASE BAĞLANTISI ---
        const firebaseConfig = {
            apiKey: "AIzaSyDuJJDmk9238bLwmZ0cBewzY2v0oRUKY4s",
            authDomain: "smartnote-dcc6d.firebaseapp.com",
            databaseURL: "https://smartnote-dcc6d-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "smartnote-dcc6d",
            storageBucket: "smartnote-dcc6d.firebasestorage.app",
            messagingSenderId: "38763164853",
            appId: "1:38763164853:web:04b837e0dbb7cf04dd3afc",
            measurementId: "G-HMWQD7YS4J"
        };
        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                currentUserUid = user.uid; 
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('flex');
                document.getElementById('user-email-display').innerText = user.email;
                loadDashboard(); // Giriş yapınca ana ekranı yükle
            } else {
                currentUserUid = null;
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('flex');
            }
        });

        // --- AUTH İŞLEMLERİ ---
        async function loginWithGoogle() { try { await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch (err) { showToast("Giriş iptal edildi.", "error"); } }
        async function login() { try { await firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value); } catch (err) { showToast("Hatalı giriş", "error"); } }
        function logout() { firebase.auth().signOut(); }

        // --- VERİ İŞLEMLERİ (DASHBOARD) ---
        async function loadDashboard() {
            try {
                const response = await fetch(`${SERVER_URL}/get_all?uid=${currentUserUid}`);
                globalNotes = await response.json();
                
                // İstatistikleri Güncelle
                document.getElementById('total-docs').innerText = globalNotes.length;
                if(globalNotes.length > 0 && globalNotes[0].date) {
                    document.getElementById('last-update').innerText = globalNotes[0].date.split(',')[0]; // Sadece tarihi al
                }

                // Etiketleri Topla ve Ekrana Bas
                extractAndRenderTags(globalNotes);
                
                // Kartları Ekrana Bas
                renderCards(globalNotes);

            } catch (err) { showToast("Veriler yüklenirken hata oluştu", "error"); }
        }

        function extractAndRenderTags(notes) {
            const tagContainer = document.getElementById('ai-tags-container');
            const allTags = new Set();
            notes.forEach(note => { if(note.tags) note.tags.forEach(t => allTags.add(t)); });
            
            if(allTags.size === 0) return;
            
            tagContainer.innerHTML = '';
            // En fazla 15 benzersiz etiket gösterelim
            Array.from(allTags).slice(0, 15).forEach(tag => {
                const badge = document.createElement('span');
                badge.className = "bg-blue-50 text-blue-600 border border-blue-100 px-3 py-1.5 rounded-full text-xs font-medium cursor-pointer hover:bg-blue-100 transition-colors shadow-sm";
                badge.innerText = tag;
                badge.onclick = () => {
                    document.getElementById('searchInput').value = tag;
                    searchTags();
                };
                tagContainer.appendChild(badge);
            });
        }

        function renderCards(notesList) {
            const container = document.getElementById('resultsArea');
            if(notesList.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center py-20 text-slate-400 bg-white rounded-xl border border-slate-200 border-dashed"><span class="text-4xl mb-3">🗂️</span><p class="text-sm">Arşiviniz boş. İlk evrağınızı ekleyin.</p></div>`;
                return;
            }

            container.innerHTML = '';
            notesList.forEach(note => {
                const tagsHtml = (note.tags || []).map(t => `<span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[11px] font-medium tracking-wide">${t}</span>`).join('');
                const dateHtml = note.date ? note.date : "Tarih Yok";
                const idHtml = note.short_id ? note.short_id : "ID YOK";

                container.innerHTML += `
                <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-4 border-b border-slate-100 pb-3">
                        <div>
                            <span class="text-slate-400 font-bold text-xs tracking-wider">EVRAK #${idHtml}</span>
                            <div class="mt-2 flex flex-wrap gap-1.5">${tagsHtml}</div>
                        </div>
                        <span class="text-slate-400 text-xs font-medium">${dateHtml}</span>
                    </div>
                    <p class="text-slate-700 text-sm leading-relaxed whitespace-pre-wrap">${note.text}</p>
                    <div class="mt-4 pt-3 flex justify-end">
                        <button onclick="navigator.clipboard.writeText(\`${note.text.replace(/`/g, '')}\`); showToast('Metin kopyalandı!')" class="text-slate-400 hover:text-slate-800 text-xs font-medium flex items-center gap-1 transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Kopyala
                        </button>
                    </div>
                </div>`;
            });
        }

        async function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return showToast("Lütfen bir dosya seçin.", "error");

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("uid", currentUserUid); 

            const btn = document.getElementById('uploadBtn');
            btn.innerText = "Yapay Zeka Okuyor..."; btn.disabled = true; btn.classList.add("opacity-60");
            
            try {
                const response = await fetch(`${SERVER_URL}/upload`, { method: "POST", body: formData });
                if (response.ok) {
                    showToast("Evrak başarıyla işlendi ve arşivlendi!");
                    fileInput.value = ""; document.getElementById('fileNameDisplay').classList.add('hidden');
                    loadDashboard(); // Arayüzü yenile
                } else { showToast("İşleme hatası.", "error"); }
            } catch (err) { showToast("Bağlantı hatası.", "error"); } 
            finally { btn.innerText = "Sisteme İşle"; btn.disabled = false; btn.classList.remove("opacity-60"); }
        }

        async function searchTags() {
            const tag = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!tag) return loadDashboard(); // Boşsa hepsini göster

            document.getElementById('resultsArea').innerHTML = `<div class="flex justify-center py-10"><div class="animate-spin rounded-full h-6 w-6 border-b-2 border-slate-900"></div></div>`;
            try {
                const response = await fetch(`${SERVER_URL}/search?tag=${tag}&uid=${currentUserUid}`);
                renderCards(await response.json());
            } catch (err) { showToast("Arama hatası", "error"); }
        }

        async function downloadPDF() {
            if (!currentUserUid || globalNotes.length === 0) return showToast("İndirilecek evrak yok", "error");
            showToast("Profesyonel Rapor Hazırlanıyor...", "info");
            
            let htmlContent = `
            <div style="padding: 40px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
                <div style="margin-bottom: 40px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <h1 style="color: #0f172a; font-size: 24px; margin: 0; font-weight: bold; letter-spacing: -0.5px;">AKILLI DEFTER ARŞİVİ</h1>
                        <p style="color: #64748b; font-size: 11px; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px;">Konsolide Dijital Evrak Raporu</p>
                    </div>
                    <div style="text-align: right; color: #94a3b8; font-size: 10px;">
                        Tarih: ${new Date().toLocaleDateString('tr-TR')}
                    </div>
                </div>`;
            
            globalNotes.forEach(note => {
                const d = note.date || ""; const id = note.short_id || "";
                htmlContent += `
                <div style="margin-bottom: 25px; page-break-inside: avoid; border: 1px solid #f1f5f9; padding: 20px; border-radius: 8px;">
                    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 12px;">
                        <span style="font-size: 10px; font-weight: bold; color: #475569; letter-spacing: 1px;">EVRAK: #${id}</span>
                        <span style="font-size: 10px; color: #94a3b8;">${d}</span>
                    </div>
                    <p style="white-space: pre-wrap; font-size: 12px; line-height: 1.6; color: #334155; margin: 0;">${note.text}</p>
                </div>`;
            });
            htmlContent += '</div>';

            const element = document.createElement('div'); element.innerHTML = htmlContent;
            html2pdf().set({
                margin: [10, 10, 10, 10], filename: 'Akill_Defter_Raporu.pdf',
                image: { type: 'jpeg', quality: 1 }, html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save().then(() => showToast("Rapor İndirildi!"));
        }
    </script>
</body>
</html>
