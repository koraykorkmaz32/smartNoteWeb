<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Defter Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK'ları -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>

    <!-- PDF Oluşturma Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">

    <!-- GİRİŞ / KAYIT EKRANI (YENİ TASARIM) -->
    <div id="login-section" class="max-w-sm mx-auto bg-white rounded-xl shadow-lg overflow-hidden p-8 space-y-6 mt-10">
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-blue-600 mb-1">Akıllı Defter</h1>
            <p class="text-sm text-gray-500">Dijital not arşivinize hoş geldiniz</p>
        </div>

        <!-- Google ile Giriş Butonu -->
        <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 font-semibold py-2.5 rounded-lg hover:bg-gray-50 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Google ile Devam Et
        </button>

        <div class="relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-white text-gray-500">veya e-posta ile</span>
            </div>
        </div>

        <!-- E-posta ile Giriş -->
        <div class="space-y-3">
            <input type="email" id="email" placeholder="E-posta adresiniz" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" id="password" placeholder="Şifreniz" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            
            <div class="flex justify-end">
                <button onclick="resetPassword()" class="text-xs text-blue-600 hover:underline">Şifremi Unuttum</button>
            </div>
        </div>
        
        <div class="flex gap-2 pt-2">
            <button onclick="login()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors">Giriş Yap</button>
            <button onclick="register()" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2.5 rounded-lg transition-colors">Kayıt Ol</button>
        </div>
        
        <p id="auth-error" class="text-red-500 text-sm text-center font-medium h-4"></p>
    </div>

    <!-- ANA UYGULAMA EKRANI -->
    <div id="app-section" class="max-w-md mx-auto bg-white rounded-xl shadow-lg overflow-hidden p-6 space-y-6 hidden mt-4">
        
        <div class="flex justify-between items-center border-b pb-3">
            <div>
                <h1 class="text-xl font-extrabold text-gray-800">Akıllı Defter 📝</h1>
                <p id="user-email-display" class="text-xs text-gray-500"></p>
            </div>
            <button onclick="logout()" class="text-sm bg-red-50 text-red-600 font-bold px-3 py-1.5 rounded-lg hover:bg-red-100">Çıkış</button>
        </div>
        
        <!-- Yükleme Bölümü -->
        <div class="space-y-4 p-5 bg-blue-50/50 border border-blue-100 rounded-xl">
            <h2 class="text-lg font-semibold text-blue-900">Yeni Not Ekle</h2>
            <input type="file" id="fileInput" accept="image/*" class="w-full text-sm text-gray-500 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 cursor-pointer"/>
            <button onclick="uploadImage()" id="uploadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-sm transition-all">📸 Sayfayı Tara ve Kaydet</button>
            <p id="uploadStatus" class="text-sm text-center font-medium h-4 text-blue-600"></p>
        </div>

        <!-- Arama Bölümü -->
        <div class="space-y-4 pt-4">
            <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Notlarda Ara</h2>
            <div class="flex gap-2">
                <span class="inline-flex items-center px-4 bg-gray-100 rounded-l-lg border border-gray-300 text-gray-500">#</span>
                <input type="text" id="searchInput" placeholder="Örn: Borsa, Toplantı..." class="rounded-r-lg bg-gray-50 border border-gray-300 w-full p-3 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button onclick="searchTags()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-lg shadow-sm transition-colors">🔎 Etiketi Ara</button>
            
            <button onclick="downloadPDF()" class="w-full bg-red-50 text-red-600 border border-red-200 font-bold py-3 rounded-lg mt-2 hover:bg-red-100 transition-colors">📄 Tüm Defteri PDF İndir</button>
        </div>
        <div id="resultsArea" class="space-y-4 mt-4"></div>
    </div>

    <script>
        // --- 1. FIREBASE BAĞLANTISI ---
        const firebaseConfig = {
            apiKey: "AIzaSyDuJJDmk9238bLwmZ0cBewzY2v0oRUKY4s",
            authDomain: "smartnote-dcc6d.firebaseapp.com",
            databaseURL: "https://smartnote-dcc6d-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "smartnote-dcc6d",
            storageBucket: "smartnote-dcc6d.firebasestorage.app",
            messagingSenderId: "38763164853",
            appId: "1:38763164853:web:04b837e0dbb7cf04dd3afc",
            measurementId: "G-HMWQD7YS4J"
        };
        firebase.initializeApp(firebaseConfig);

        const SERVER_URL = "https://smartnoteapi-hgkd.onrender.com"; 
        let currentUserUid = null; 

        // --- 2. OTURUM TAKİPÇİSİ ---
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                currentUserUid = user.uid; 
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                // Kullanıcının e-postasını ekranda göster
                document.getElementById('user-email-display').innerText = user.email;
            } else {
                currentUserUid = null;
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        });

        // --- 3. YENİ: GOOGLE İLE GİRİŞ ---
        async function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await firebase.auth().signInWithPopup(provider);
                document.getElementById('auth-error').innerText = "";
            } catch (err) {
                document.getElementById('auth-error').innerText = "Google girişi iptal edildi.";
            }
        }

        // --- 4. YENİ: ŞİFRE SIFIRLAMA ---
        async function resetPassword() {
            const email = document.getElementById('email').value;
            if (!email) {
                document.getElementById('auth-error').innerText = "Lütfen e-posta adresinizi yazıp tekrar tıklayın.";
                return;
            }
            try {
                await firebase.auth().sendPasswordResetEmail(email);
                document.getElementById('auth-error').innerText = "";
                alert("Şifre sıfırlama bağlantısı e-posta adresinize gönderildi! (Spam klasörünü kontrol etmeyi unutmayın)");
            } catch (err) {
                document.getElementById('auth-error').innerText = "Hesap bulunamadı veya geçersiz e-posta.";
            }
        }

        // --- 5. STANDART GİRİŞ/KAYIT ---
        async function register() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try { 
                await firebase.auth().createUserWithEmailAndPassword(e, p); 
                document.getElementById('auth-error').innerText = "";
            } catch (err) { document.getElementById('auth-error').innerText = "Kayıt hatası: Şifre en az 6 hane olmalı."; }
        }

        async function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try { 
                await firebase.auth().signInWithEmailAndPassword(e, p); 
                document.getElementById('auth-error').innerText = "";
            } catch (err) { document.getElementById('auth-error').innerText = "E-posta veya şifre hatalı!"; }
        }

        function logout() { firebase.auth().signOut(); }

        // --- 6. ARKA PLAN İŞLEMLERİ (Aynı Kalanlar) ---
        async function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return alert("Fotoğraf seçin!");

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("uid", currentUserUid); 

            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('uploadStatus');
            
            btn.innerText = "⏳ Taranıyor, Lütfen Bekleyin...";
            btn.classList.add("opacity-70", "cursor-not-allowed");
            status.innerText = "";
            
            try {
                const response = await fetch(`${SERVER_URL}/upload`, { method: "POST", body: formData });
                status.innerText = response.ok ? "✅ Başarıyla kaydedildi!" : "❌ Sunucu Hatası!";
            } catch (err) {
                status.innerText = "❌ Bağlantı hatası!";
            } finally {
                btn.innerText = "📸 Sayfayı Tara ve Kaydet";
                btn.classList.remove("opacity-70", "cursor-not-allowed");
                fileInput.value = ""; // Seçili dosyayı temizle
            }
        }

        async function searchTags() {
            const tag = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultsArea = document.getElementById('resultsArea');
            if (!tag) return;

            resultsArea.innerHTML = '<p class="text-blue-500 text-center text-sm">Aranıyor...</p>';

            try {
                const response = await fetch(`${SERVER_URL}/search?tag=${tag}&uid=${currentUserUid}`);
                const results = await response.json();
                
                resultsArea.innerHTML = results.length === 0 ? '<p class="text-gray-500 text-center text-sm bg-gray-50 p-4 rounded-lg">Bu etiketle eşleşen not bulunamadı.</p>' : '';
                
                results.forEach(note => {
                    resultsArea.innerHTML += `
                    <div class="p-5 bg-white border border-gray-200 shadow-sm rounded-xl transition-all hover:shadow-md">
                        <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-bold mb-3">📄 Sayfa: ${note.page_id}</span>
                        <p class="text-gray-700 text-sm leading-relaxed">${note.text}</p>
                    </div>`;
                });
            } catch (err) { resultsArea.innerHTML = '<p class="text-red-500 text-center text-sm">Sunucuya bağlanılamadı.</p>'; }
        }

        async function downloadPDF() {
            if (!currentUserUid) return alert("Önce giriş yapmalısınız!");
            
            try {
                const response = await fetch(`${SERVER_URL}/get_all?uid=${currentUserUid}`);
                if (!response.ok) return alert("Sunucudan notlar alınamadı!");
                
                const notes = await response.json();
                if (notes.length === 0) return alert("Defterinizde henüz not yok!");

                let htmlContent = `
                <div style="padding: 30px; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                    <div style="text-align: center; margin-bottom: 40px;">
                        <h1 style="color: #1e40af; font-size: 32px; margin: 0; letter-spacing: -1px;">Akıllı Defter</h1>
                        <p style="color: #64748b; font-size: 14px; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px;">Dijital Not Arşivi</p>
                        <div style="height: 3px; background: linear-gradient(to right, #3b82f6, #1d4ed8); margin-top: 20px; border-radius: 2px;"></div>
                    </div>
                `;
                
                notes.forEach(note => {
                    htmlContent += `
                    <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-left: 5px solid #3b82f6; border-radius: 8px; padding: 25px; margin-bottom: 25px; page-break-inside: avoid;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px dashed #cbd5e1; padding-bottom: 10px;">
                            <span style="background-color: #dbeafe; color: #1e40af; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px;">📄 Sayfa: ${note.page_id}</span>
                        </div>
                        <p style="white-space: pre-wrap; font-size: 15px; line-height: 1.8; color: #334155; margin: 0;">${note.text}</p>
                    </div>`;
                });
                htmlContent += '</div>';

                const element = document.createElement('div');
                element.innerHTML = htmlContent;
                
                alert("PDF şık bir formatta hazırlanıyor... Lütfen indirme ekranı gelene kadar bekleyin.");
                
                const opt = {
                    margin:       [10, 5, 10, 5],
                    filename:     'Akilli_Defter_Arsivi.pdf',
                    image:        { type: 'jpeg', quality: 1 },
                    html2canvas:  { scale: 2, useCORS: true, logging: false },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(element).save();

            } catch (error) {
                alert("PDF oluşturulurken bir hata oluştu: " + error.message);
            }
        }
    </script>
</body>
</html>
